<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0B1410" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Pitch Chart" />
<meta name="description" content="Live pitch charting and opponent tendency tool." />
<title>Pitch Chart</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0B1410;--panel:#12211B;--raise:#1A2E26;--line:#25402F;--chalk:#E8EDE7;--sage:#7C8C82;--dirt:#C98B5E;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:var(--bg);}
body{color:var(--chalk);font-family:'Archivo',system-ui,-apple-system,sans-serif;min-height:100vh;padding:14px;-webkit-font-smoothing:antialiased;padding-bottom:env(safe-area-inset-bottom,14px);}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--dirt);outline-offset:2px;}

.topbar{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:13px;}
.brand{font-family:'Barlow Condensed';font-weight:700;font-size:27px;letter-spacing:.06em;text-transform:uppercase;line-height:1;}
.brand small{display:block;font-family:'Archivo';font-size:10.5px;font-weight:500;letter-spacing:.17em;color:var(--sage);margin-top:4px;}
.tabs{display:flex;gap:5px;flex-wrap:wrap;}
.tab{padding:9px 15px;border-radius:4px;font-size:11.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--sage);background:var(--panel);}
.tab.on{background:var(--chalk);color:var(--bg);}

.gamebar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:13px;}
.gamesel{background:var(--panel);border:1px solid var(--line);color:var(--chalk);padding:9px 11px;border-radius:4px;font-size:13px;font-family:inherit;max-width:100%;}
.mini{padding:9px 13px;border-radius:4px;background:var(--panel);border:1px solid var(--line);font-size:11.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--sage);}
.mini:hover{color:var(--chalk);border-color:var(--sage);}

.grid{display:grid;grid-template-columns:300px 1fr;gap:13px;align-items:start;}
@media(max-width:820px){.grid{grid-template-columns:1fr;}}
.col{display:flex;flex-direction:column;gap:13px;}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px;}
.ptitle{font-family:'Barlow Condensed';font-weight:600;font-size:14px;letter-spacing:.16em;text-transform:uppercase;color:var(--sage);margin:0 0 11px;display:flex;justify-content:space-between;align-items:center;gap:8px;}
.ptitle .aside{font-family:'Archivo';font-size:10px;letter-spacing:.08em;text-transform:none;opacity:.75;}

.bar{display:flex;align-items:center;gap:8px;background:var(--raise);border-radius:5px;padding:8px 9px;margin-bottom:9px;}
.bar .who{flex:1;min-width:0;}
.bar .slot{font-family:'IBM Plex Mono';font-size:11px;color:var(--sage);}
.bar .nm{font-family:'Barlow Condensed';font-weight:700;font-size:19px;letter-spacing:.03em;text-transform:uppercase;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.bar .nav{padding:7px 11px;border-radius:4px;background:var(--panel);color:var(--sage);font-size:14px;line-height:1;}
.bar .nav:hover{color:var(--chalk);}
.bar.arm{border-left:3px solid var(--dirt);}
.bar .tiny{padding:6px 9px;border-radius:4px;background:var(--panel);color:var(--sage);font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;}
.bar .tiny:hover{color:var(--chalk);}

.subpanel{background:var(--raise);border:1px solid var(--dirt);border-radius:5px;padding:11px;margin-bottom:9px;}
.subpanel .sl{font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--sage);margin-bottom:7px;}
.subpanel input{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:9px;color:var(--chalk);font-family:inherit;font-size:13.5px;width:100%;margin-bottom:7px;}
.subpanel input:focus{outline:none;border-color:var(--dirt);}
.rowbtns{display:flex;gap:6px;flex-wrap:wrap;}

.board{display:flex;gap:14px;align-items:center;margin-bottom:11px;}
.bigcount{font-family:'IBM Plex Mono';font-weight:600;font-size:44px;line-height:.9;letter-spacing:-.02em;}
.pipcol{display:flex;flex-direction:column;gap:5px;}
.piprow{display:flex;align-items:center;gap:7px;}
.piprow .lab{font-family:'Barlow Condensed';font-size:12px;letter-spacing:.14em;color:var(--sage);width:13px;}
.pips{display:flex;gap:4px;}
.pip{width:11px;height:11px;border-radius:50%;border:1.5px solid #2C4438;display:block;}

.staterow{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:9px;}
.chip{padding:7px 11px;border-radius:4px;background:var(--raise);border:1px solid var(--line);font-size:12px;font-weight:600;color:var(--sage);}
.chip.on{background:var(--chalk);color:var(--bg);border-color:var(--chalk);}
.chip.sm{font-size:11px;padding:6px 9px;}
.chip.warn{border-color:#5c2f24;color:#FF8A3D;}
.chip.warn:hover{border-color:#FF5A47;}
.stepper{display:flex;align-items:center;background:var(--raise);border:1px solid var(--line);border-radius:4px;overflow:hidden;}
.stepper b{font-family:'IBM Plex Mono';font-size:12.5px;padding:0 8px;min-width:52px;text-align:center;font-weight:600;}
.stepper button{padding:7px 10px;font-size:14px;color:var(--sage);line-height:1;}
.stepper button:hover{color:var(--chalk);background:var(--line);}

.zonewrap{display:flex;flex-direction:column;align-items:center;gap:6px;}
.zonelabels{display:flex;justify-content:space-between;width:100%;font-family:'Barlow Condensed';font-size:11px;letter-spacing:.13em;color:var(--sage);}
.zone{display:grid;grid-template-columns:repeat(5,1fr);gap:3px;width:100%;max-width:250px;aspect-ratio:1;}
.zcell{border:1px solid #21382C;border-radius:3px;background:#0E1B16;}
.zcell.inzone{border-color:#3A5C48;background:#14251D;}
.zcell.pick{background:var(--chalk);border-color:var(--chalk);}

.typegrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(86px,1fr));gap:7px;}
.tbtn{padding:13px 8px;border-radius:5px;background:var(--raise);border:1.5px solid var(--line);text-align:center;}
.tbtn:active{transform:scale(.97);}
.tbtn .tc{font-family:'Barlow Condensed';font-weight:700;font-size:22px;letter-spacing:.04em;line-height:1;}
.tbtn .tl{font-size:10px;color:var(--sage);letter-spacing:.05em;margin-top:3px;}
.tbtn.on .tl{color:rgba(11,20,16,.65);}

.resgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(102px,1fr));gap:7px;}
.rbtn{padding:15px 8px;border-radius:5px;background:var(--raise);border:1.5px solid var(--line);font-size:12.5px;font-weight:600;letter-spacing:.04em;}
.rbtn:hover{border-color:var(--sage);}
.rbtn.armed{border-color:var(--dirt);color:#fff;}
.rbtn[disabled]{opacity:.32;cursor:not-allowed;}
.rbtn.sel{background:var(--chalk);color:var(--bg);border-color:var(--chalk);}

.hint{font-size:11.5px;color:var(--sage);letter-spacing:.04em;margin:0 0 9px;}
.hint b{color:var(--chalk);font-weight:600;}

.tellbank{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:9px 0 0;margin-top:10px;border-top:1px dashed var(--line);}
.tblab{font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--sage);}

.log{display:flex;flex-direction:column;gap:4px;max-height:260px;overflow-y:auto;}
.logrow{display:flex;align-items:center;gap:9px;font-size:12px;padding:6px 8px;background:var(--raise);border-radius:4px;width:100%;text-align:left;}
.logrow .dot{width:9px;height:9px;border-radius:50%;flex:none;}
.logrow .cnt{font-family:'IBM Plex Mono';font-size:11.5px;color:var(--sage);}
.logrow .res{margin-left:auto;color:var(--sage);font-size:11px;text-transform:uppercase;letter-spacing:.06em;}
.logrow .who2{color:var(--sage);font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:90px;}

.keylist{display:flex;flex-direction:column;gap:8px;}
.key{display:flex;gap:11px;align-items:center;background:var(--raise);border-left:3px solid;border-radius:0 5px 5px 0;padding:11px 13px;}
.key .kpct{font-family:'IBM Plex Mono';font-weight:600;font-size:21px;min-width:52px;}
.key .ktxt{font-size:13px;line-height:1.4;}
.key .ktxt em{font-style:normal;color:var(--sage);font-size:11px;display:block;margin-top:2px;letter-spacing:.04em;}

.mixbar{display:flex;height:14px;border-radius:3px;overflow:hidden;background:var(--raise);}
.mixseg{height:100%;}
.mixlegend{display:flex;flex-wrap:wrap;gap:11px;margin-top:9px;font-size:11.5px;color:var(--sage);}
.legitem{display:flex;align-items:center;gap:5px;}
.legitem i{width:9px;height:9px;border-radius:2px;display:block;}
.legitem em{font-style:normal;opacity:.6;}

.countgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;}
.cbox{background:var(--raise);border-radius:5px;padding:10px;}
.cbox .cl{font-family:'IBM Plex Mono';font-size:14px;font-weight:600;margin-bottom:7px;}
.cbox .cn{font-size:10.5px;color:var(--sage);float:right;font-family:'Archivo';font-weight:500;}
.cbox .row{display:flex;justify-content:space-between;font-size:11.5px;margin-top:3px;}
.cbox .row span:first-child{display:flex;align-items:center;gap:5px;}
.cbox .row i{width:7px;height:7px;border-radius:2px;display:block;}
.cbox.dim{opacity:.4;}

.seqrow{display:flex;align-items:center;gap:10px;background:var(--raise);border-radius:5px;padding:11px 13px;flex-wrap:wrap;}
.arrow{color:var(--sage);font-size:15px;}
.tag{font-family:'Barlow Condensed';font-weight:700;font-size:16px;padding:4px 9px;border-radius:3px;color:var(--bg);letter-spacing:.03em;}
.seqrow .meta{margin-left:auto;font-size:11px;color:var(--sage);letter-spacing:.05em;}
.mono{font-family:'IBM Plex Mono';font-size:14px;font-weight:600;}

.loczone{display:flex;gap:13px;flex-wrap:wrap;}
.loccard{background:var(--raise);border-radius:5px;padding:11px;display:flex;flex-direction:column;align-items:center;gap:7px;}
.loccard .lt{font-family:'Barlow Condensed';font-weight:700;font-size:15px;letter-spacing:.05em;}
.minizone{display:grid;grid-template-columns:repeat(5,1fr);gap:2px;width:92px;height:92px;}
.mzcell{border:1px solid #21382C;border-radius:2px;}
.mzcell.mzin{border-color:#436B53;}

.statrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(94px,1fr));gap:8px;}
.stat{background:var(--raise);border-radius:5px;padding:11px;}
.stat .sv{font-family:'IBM Plex Mono';font-weight:600;font-size:22px;line-height:1;}
.stat .sl{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--sage);margin-top:6px;}
.stat .ss{font-size:10.5px;color:var(--sage);opacity:.7;margin-top:2px;}

.htable{width:100%;border-collapse:collapse;font-size:12.5px;}
.htable th{text-align:left;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--sage);font-weight:600;padding:0 8px 8px;}
.htable td{padding:9px 8px;border-top:1px solid var(--line);font-family:'IBM Plex Mono';}
.htable td.nm{font-family:'Archivo';font-weight:600;}
.htable td.txt{font-family:'Archivo';font-size:12px;}
.tblwrap{overflow-x:auto;}

.vscard{background:var(--raise);border-radius:5px;padding:11px;min-width:150px;}
.vscard .vt{font-family:'Barlow Condensed';font-weight:700;font-size:16px;margin-bottom:7px;}
.vsrow{display:flex;justify-content:space-between;font-size:11.5px;color:var(--sage);margin-top:4px;}
.vsrow b{color:var(--chalk);font-family:'IBM Plex Mono';font-weight:600;}

.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:9px;align-items:center;}
.flabel{font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--sage);margin-right:2px;}
.gap{width:10px;}
.sec{margin-bottom:14px;}
.empty{text-align:center;padding:34px 18px;color:var(--sage);font-size:13px;line-height:1.6;}
.empty-inline{color:var(--sage);font-size:12px;}

.setup{max-width:560px;margin:22px auto;}
.frow{display:flex;gap:9px;margin-bottom:9px;flex-wrap:wrap;align-items:flex-end;}
.field{flex:1;min-width:140px;display:flex;flex-direction:column;gap:5px;}
.field label{font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--sage);font-weight:600;}
.field input{background:var(--raise);border:1px solid var(--line);border-radius:4px;padding:11px;color:var(--chalk);font-family:inherit;font-size:14px;width:100%;}
.field input:focus{outline:none;border-color:var(--dirt);}
.go{width:100%;padding:14px;border-radius:5px;background:var(--chalk);color:var(--bg);font-weight:700;font-size:13px;letter-spacing:.12em;text-transform:uppercase;margin-top:5px;}
.lineup{display:flex;flex-direction:column;gap:4px;margin-bottom:10px;}
.lrow{display:flex;align-items:center;gap:7px;background:var(--raise);border-radius:4px;padding:8px 10px;font-size:13px;}
.lrow .ln{font-family:'IBM Plex Mono';color:var(--sage);font-size:11.5px;min-width:14px;}
.lrow .nmx{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.lrow .mv{color:var(--sage);font-size:11px;padding:3px 5px;line-height:1;}
.lrow .mv:hover{color:var(--chalk);}
.lrow .sb{color:var(--sage);font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:4px 7px;border:1px solid var(--line);border-radius:3px;}
.lrow .sb:hover{color:var(--chalk);border-color:var(--sage);}
.lrow .x{color:var(--sage);font-size:15px;line-height:1;padding:2px 6px;}
.lrow .x:hover{color:#FF5A47;}
.note{font-size:11.5px;color:var(--sage);line-height:1.55;margin:8px 0 0;}

.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--chalk);color:var(--bg);padding:11px 20px;border-radius:5px;font-size:12.5px;font-weight:600;z-index:50;max-width:90vw;text-align:center;}
.veloin{background:var(--raise);border:1px solid var(--line);border-radius:4px;padding:7px 9px;color:var(--chalk);font-family:'IBM Plex Mono';font-size:12.5px;width:72px;}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;}}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ================= config ================= */
var PITCH_TYPES=[
 {code:"FB",label:"Fastball",color:"#FF5A47"},
 {code:"SI",label:"Sinker",color:"#FF8A3D"},
 {code:"CT",label:"Cutter",color:"#FFC53D"},
 {code:"SL",label:"Slider",color:"#4EA8FF"},
 {code:"CB",label:"Curve",color:"#B98CFF"},
 {code:"CH",label:"Change",color:"#3FCF8E"},
 {code:"SP",label:"Split",color:"#5CE1D8"}];
var TYPE_MAP={};PITCH_TYPES.forEach(function(t){TYPE_MAP[t.code]=t;});
function colorOf(c){return TYPE_MAP[c]?TYPE_MAP[c].color:"#7C8C82";}

var RESULTS=[{code:"B",label:"Ball"},{code:"CS",label:"Called strike"},{code:"SS",label:"Swing &amp; miss"},
 {code:"F",label:"Foul"},{code:"IP",label:"In play"},{code:"HBP",label:"HBP"}];
var RES_LABEL={};RESULTS.forEach(function(r){RES_LABEL[r.code]=r.label;});
var OUTCOMES=[{code:"OUT",label:"Out"},{code:"1B",label:"Single"},{code:"2B",label:"Double"},
 {code:"3B",label:"Triple"},{code:"HR",label:"Home run"},{code:"ROE",label:"Error / FC"}];
var CONTACT=[{code:"hard",label:"Hard",color:"#3FCF8E"},{code:"med",label:"Medium",color:"#FFC53D"},{code:"weak",label:"Weak",color:"#FF5A47"}];
var IN_ZONE=[6,7,8,11,12,13,16,17,18];
function inZone(z){return IN_ZONE.indexOf(z)>=0;}
var COUNTS=["0-0","0-1","0-2","1-0","1-1","1-2","2-0","2-1","2-2","3-0","3-1","3-2"];
var STORE="pitchchart:v1";

function isSwing(r){return r==="SS"||r==="F"||r==="IP";}
function isStrikeRes(r){return r==="CS"||r==="SS"||r==="F";}
function pc(a,b){return b?Math.round(a/b*100):0;}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(m){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m];});}
function clone(o){return JSON.parse(JSON.stringify(o));}

/* ================= state ================= */
var S={
 games:[], activeId:null, tab:"chart", toast:"",
 live:{inning:1,outs:0,balls:0,strikes:0,seq:1,hand:"R",r1:false,r2:false,r3:false,abId:1,bIdx:0,pIdx:0},
 sel:{type:null,zone:null}, pendingIP:null, activeTells:[], history:[], velo:"",
 f:{scope:"game",hand:"all",run:"all",pitcher:"all"},
 form:{opponent:"",pitcher:"",hand:"R",catcher:"",date:new Date().toISOString().slice(0,10)},
 newBat:{name:"",hand:"R"}, newTell:"",
 subOpen:false, sub:{name:"",hand:"R"},
 armOpen:false, newP:{name:"",hand:"R"}
};

function save(){try{localStorage.setItem(STORE,JSON.stringify({games:S.games,activeId:S.activeId}));}
 catch(e){flash("Couldn't save — storage may be full or blocked");}}

function migrate(g){
 if(!g.meta.pitchers||!g.meta.pitchers.length)
  g.meta.pitchers=[{id:"pp1",name:g.meta.pitcher,hand:g.meta.hand}];
 g.pitches.forEach(function(p){
  if(!p.pitcher){p.pitcher=g.meta.pitcher;p.phand=g.meta.hand;}});
 return g;}

function load(){try{var raw=localStorage.getItem(STORE);if(!raw)return;var d=JSON.parse(raw);
 S.games=(d.games||[]).map(migrate);
 S.activeId=d.activeId||(S.games[0]&&S.games[0].meta.id)||null;
 var g=game();if(g)restoreLive(g);}catch(e){}}

function game(){for(var i=0;i<S.games.length;i++)if(S.games[i].meta.id===S.activeId)return S.games[i];return null;}
function pitches(){var g=game();return g?g.pitches:[];}
function roster(){var g=game();return g&&g.meta.roster?g.meta.roster:[];}
function arms(){var g=game();return g&&g.meta.pitchers?g.meta.pitchers:[];}
function tells(){var g=game();return g&&g.meta.tells?g.meta.tells:[];}
function tipsOn(){var g=game();return !!(g&&g.meta.tipsOn);}
function batter(){var r=roster();return r.length?r[S.live.bIdx%r.length]:null;}
function arm(){var a=arms();return a.length?a[Math.min(S.live.pIdx,a.length-1)]:null;}

var toastTimer=null;
function flash(m){S.toast=m;render();clearTimeout(toastTimer);toastTimer=setTimeout(function(){S.toast="";render();},2200);}

/* ================= analysis ================= */
function mix(ps){var c={};ps.forEach(function(p){c[p.type]=(c[p.type]||0)+1;});var tot=ps.length||1;
 return Object.keys(c).map(function(k){return{code:k,n:c[k],pct:Math.round(c[k]/tot*100)};}).sort(function(a,b){return b.n-a.n;});}

/* A tendency is only news if it differs from what he does the rest of the time.
   Everything below is scored as lift over this pitcher's own baseline mix. */
var MIN_N=4, MIN_PCT=45, MIN_LIFT=18;

function buildKeys(ps){
 var base={};mix(ps).forEach(function(m){base[m.code]=m.pct;});
 var buckets=[
  {label:"First pitch of the at-bat",t:function(p){return p.balls===0&&p.strikes===0;}},
  {label:"With two strikes",t:function(p){return p.strikes===2;}},
  {label:"Ahead in the count",t:function(p){return p.strikes>p.balls;}},
  {label:"Behind in the count",t:function(p){return p.balls>p.strikes;}},
  {label:"Runners on base",t:function(p){return p.r1||p.r2||p.r3;}},
  {label:"Bases empty",t:function(p){return !p.r1&&!p.r2&&!p.r3;}},
  {label:"vs. left-handed hitters",t:function(p){return p.hand==="L";}},
  {label:"vs. right-handed hitters",t:function(p){return p.hand==="R";}}];
 /* 0-0 is the same set as "first pitch" — skip it so the list can't say it twice */
 COUNTS.forEach(function(c){if(c==="0-0")return;var a=c.split("-");
  buckets.push({label:"On "+c,t:function(p){return p.balls===+a[0]&&p.strikes===+a[1];}});});

 var keys=[];
 buckets.forEach(function(bk){
  var set=ps.filter(bk.t);if(set.length<MIN_N)return;
  var m=mix(set);if(!m.length)return;
  var best=null;
  m.slice(0,2).forEach(function(d){
   var lift=d.pct-(base[d.code]||0);
   if(d.pct>=MIN_PCT&&lift>=MIN_LIFT&&(!best||lift>best.lift))
    best={code:d.code,pct:d.pct,n:d.n,lift:lift};});
  if(!best)return;
  keys.push({label:bk.label,type:best.code,pct:best.pct,base:base[best.code]||0,lift:best.lift,
   n:best.n,total:set.length,thin:set.length<6,score:best.lift*Math.min(set.length,24)});});

 /* location: same idea — compare a pitch type's location to where everything else goes */
 var zoned=ps.filter(function(p){return p.zone!=null;});
 if(zoned.length>=12){
  var dims=[
   {key:"low",txt:"finishes low or below the zone",t:function(p){return Math.floor(p.zone/5)>=3;}},
   {key:"up",txt:"lives up in the zone",t:function(p){return Math.floor(p.zone/5)<=1;}},
   {key:"chase",txt:"is out of the zone",t:function(p){return !inZone(p.zone);}}];
  PITCH_TYPES.forEach(function(t){
   var set=zoned.filter(function(p){return p.type===t.code;});if(set.length<5)return;
   var rest=zoned.filter(function(p){return p.type!==t.code;});if(rest.length<5)return;
   dims.forEach(function(d){
    var v=pc(set.filter(d.t).length,set.length),b=pc(rest.filter(d.t).length,rest.length);
    if(v>=50&&v-b>=MIN_LIFT)
     keys.push({loc:true,text:v+"% of his "+t.label.toLowerCase()+"s "+d.txt,
      type:t.code,pct:v,base:b,lift:v-b,n:set.filter(d.t).length,total:set.length,
      thin:set.length<8,score:(v-b)*Math.min(set.length,24)});});});}

 return keys.sort(function(a,b){return b.score-a.score;}).slice(0,6);}

function buildSequences(ps){
 var byAb={};ps.forEach(function(p){(byAb[p.abId]=byAb[p.abId]||[]).push(p);});
 var map={};
 Object.keys(byAb).forEach(function(k){var ab=byAb[k].slice().sort(function(a,b){return a.seq-b.seq;});
  for(var i=1;i<ab.length;i++){var prev=ab[i-1];
   if(prev.pitcher!==ab[i].pitcher)continue;
   if(!isStrikeRes(prev.result)&&prev.result!=="B")continue;
   var key=prev.type+"|"+(prev.result==="B"?"ball":"strike");
   (map[key]=map[key]||[]).push(ab[i]);}});
 return Object.keys(map).filter(function(k){return map[k].length>=4;}).map(function(k){
  var a=k.split("|");var m=mix(map[k]);
  return{prevType:a[0],prevRes:a[1],total:map[k].length,top:m[0]};})
  .sort(function(a,b){return b.top.pct*b.total-a.top.pct*a.total;});}

function split(ps){
 var swings=ps.filter(function(p){return isSwing(p.result);});
 var oz=ps.filter(function(p){return p.zone!=null&&!inZone(p.zone);});
 var iz=ps.filter(function(p){return p.zone!=null&&inZone(p.zone);});
 var bip=ps.filter(function(p){return p.result==="IP";});
 return{seen:ps.length,swings:swings.length,swingPct:pc(swings.length,ps.length),
  whiffPct:pc(ps.filter(function(p){return p.result==="SS";}).length,swings.length),
  chasePct:pc(oz.filter(function(p){return isSwing(p.result);}).length,oz.length),ozSeen:oz.length,
  takeStrikePct:pc(iz.filter(function(p){return p.result==="CS";}).length,iz.length),izSeen:iz.length,
  bip:bip.length,hardPct:pc(bip.filter(function(p){return p.contact==="hard";}).length,bip.length),
  hits:bip.filter(function(p){return["1B","2B","3B","HR"].indexOf(p.outcome)>=0;}).length};}

function buildTells(ps,ts){
 return ts.map(function(t){
  var on=ps.filter(function(p){return(p.tells||[]).indexOf(t.id)>=0;});
  var off=ps.filter(function(p){return(p.tells||[]).indexOf(t.id)<0;});
  return{id:t.id,label:t.label,onN:on.length,onMix:mix(on),offMix:mix(off)};})
  .filter(function(t){return t.onN>=3;});}

function pool(){
 var g=game();if(!g)return[];var base;
 if(S.f.scope==="game")base=g.pitches;
 else{base=[];S.games.forEach(function(gg){
  base=base.concat(gg.pitches.map(function(p){var q=clone(p);q.abId=gg.meta.id+"-"+p.abId;return q;}));});}
 return base.filter(function(p){
  if(S.f.pitcher!=="all"&&p.pitcher!==S.f.pitcher)return false;
  if(S.f.scope==="all"&&S.f.pitcher==="all")return false;
  if(S.f.hand!=="all"&&p.hand!==S.f.hand)return false;
  if(S.f.run==="on"&&!(p.r1||p.r2||p.r3))return false;
  if(S.f.run==="empty"&&(p.r1||p.r2||p.r3))return false;
  return true;});}

   r1:last.r1,r2:last.r2,r3:last.r3,abId:last.abId+1,bIdx:(last.bIdx||0)+1,pIdx:pIdx}

function nextAbState(st){
 var r=roster();var bi=r.length?(st.bIdx+1)%r.length:st.bIdx;
 st.balls=0;st.strikes=0;st.seq=1;st.abId=st.abId+1;st.bIdx=bi;
 if(r.length)st.hand=r[bi].hand;return st;}
function addOut(st){var o=st.outs+1;
 if(o>=3){st.outs=0;st.inning=st.inning+1;st.r1=false;st.r2=false;st.r3=false;}else st.outs=o;return st;}

function commit(result,outcome,contact){
 var g=game();if(!g){flash("Start a game first");return;}
 var b=batter(),a=arm();
 g.pitches.push({id:"p"+Date.now()+Math.random().toString(36).slice(2,6),
  abId:S.live.abId,seq:S.live.seq,inning:S.live.inning,outs:S.live.outs,
  balls:S.live.balls,strikes:S.live.strikes,hand:S.live.hand,
  r1:S.live.r1,r2:S.live.r2,r3:S.live.r3,batter:b?b.name:null,bIdx:S.live.bIdx,
  pitcher:a?a.name:g.meta.pitcher,phand:a?a.hand:g.meta.hand,
  type:S.sel.type,zone:S.sel.zone,velo:S.velo?Number(S.velo):null,
  result:result,outcome:outcome||null,contact:contact||null,
  tells:tipsOn()?S.activeTells.slice():[]});

 S.history.push(clone(S.live));
 var n=clone(S.live);n.seq=n.seq+1;
 if(result==="B"){n.balls++;if(n.balls>=4){n.r1=true;n=nextAbState(n);}}
 else if(result==="CS"||result==="SS"){n.strikes++;if(n.strikes>=3){n=nextAbState(addOut(n));}}
 else if(result==="F"){if(n.strikes<2)n.strikes++;}
 else if(result==="HBP"){n.r1=true;n=nextAbState(n);}
 else if(result==="IP"){if(outcome==="OUT")n=addOut(n);n=nextAbState(n);}
 S.live=n;S.sel={type:null,zone:null};S.pendingIP=null;S.activeTells=[];save();}

function undo(){var g=game();if(!g||!g.pitches.length)return;
 g.pitches.pop();
 if(S.history.length)S.live=S.history.pop();
 S.sel={type:null,zone:null};S.pendingIP=null;save();flash("Last pitch removed");}

 var rows=g.pitches.map(function(p){
  var tl=(p.tells||[]).map(function(id){var f=ts.filter(function(t){return t.id===id;})[0];return f?f.label:"";}).join("|");
  return[g.meta.date,g.meta.opponent,p.pitcher,p.phand,p.inning,p.outs,p.balls,p.strikes,p.abId,p.seq,
   p.batter||"",p.hand,p.r1?1:0,p.r2?1:0,p.r3?1:0,p.type,p.zone,inZone(p.zone)?1:0,p.velo==null?"":p.velo,
   p.result,p.outcome||"",p.contact||"",tl].join(",");});
 var blob=new Blob([[head].concat(rows).join("\n")],{type:"text/csv"});
 var a=document.createElement("a");a.href=URL.createObjectURL(blob);

 document.body.appendChild(a);a.click();document.body.removeChild(a);}

  var have={};S.games.forEach(function(g){have[g.meta.id]=1;});
  var added=0;d.games.forEach(function(g){if(!have[g.meta.id]){S.games.push(migrate(g));added++;}});
  if(!S.activeId&&S.games.length)S.activeId=S.games[0].meta.id;
  save();flash(added+" game"+(added===1?"":"s")+" imported");}
  catch(e){flash("Couldn't read that file");}};

  if(tipsOn()&&tells().length){

 h+='<div class="panel"><h3 class="ptitle">Recent pitches</h3>';

function viewPitcher(){
 var P=pool();
 var h='<div class="filters">'+
  '<button class="chip'+(S.f.scope==="game"?" on":"")+'" data-a="fscope" data-v="game">This game</button>'+
  '<button class="chip'+(S.f.scope==="all"?" on":"")+'" data-a="fscope" data-v="all">All games, this pitcher</button><span class="gap"></span>'+
  [["all","Both hands"],["L","vs LHH"],["R","vs RHH"]].map(function(x){
   return '<button class="chip'+(S.f.hand===x[0]?" on":"")+'" data-a="fhand" data-v="'+x[0]+'">'+x[1]+'</button>';}).join("")+'<span class="gap"></span>'+
  [["all","Any base state"],["on","Runners on"],["empty","Bases empty"]].map(function(x){
   return '<button class="chip'+(S.f.run===x[0]?" on":"")+'" data-a="frun" data-v="'+x[0]+'">'+x[1]+'</button>';}).join("")+'</div>'+
  pitcherFilterRow();

 if(P.length<8)return h+'<div class="empty">'+P.length+' pitches in this filter.<br>Tendencies start showing up around 20&ndash;25 pitches, and the count splits firm up closer to 50.</div>';

 var keys=buildKeys(P);
 h+='<div class="panel sec"><h3 class="ptitle">Keys — strongest tendencies right now'+
  (S.f.pitcher!=="all"?'<span class="aside">'+esc(S.f.pitcher)+'</span>':'')+'</h3>';
 if(!keys.length)h+='<div class="empty-inline">Nothing here yet that differs from what he does the rest of the time. He\'s mixing, or there isn\'t enough sample.</div>';
 else h+='<div class="keylist">'+keys.map(function(k){
  var lbl=TYPE_MAP[k.type]?TYPE_MAP[k.type].label:k.type;
  return '<div class="key" style="border-left-color:'+colorOf(k.type)+'"><div class="kpct" style="color:'+colorOf(k.type)+'">'+k.pct+'%</div>'+
   '<div class="ktxt">'+(k.loc?k.text:k.label+' &rarr; <b>'+lbl+'</b>')+
   '<em>'+k.n+' of '+k.total+' &middot; '+(k.loc?"otherwise "+k.base+"%":"normally "+k.base+"% "+lbl.toLowerCase())+
   ' &middot; <span style="color:var(--dirt)">+'+Math.round(k.lift)+'</span>'+(k.thin?' &middot; thin sample':'')+'</em></div></div>';}).join("")+'</div>';
 if(S.f.pitcher==="all"&&arms().length>1)
  h+='<p class="note danger" style="color:#FF8A3D">You\'re looking at '+arms().length+' pitchers blended together. Pick one above.</p>';
 h+='</div>';

 if(tipsOn()){
  var ts=buildTells(P,tells());
  if(ts.length){
   h+='<div class="panel sec"><h3 class="ptitle">Pitch tips <span class="aside">what he threw when the tip showed</span></h3><div style="display:flex;flex-direction:column;gap:8px">'+
    ts.map(function(t){
     return '<div class="seqrow"><span style="font-weight:600;font-size:13px">'+esc(t.label)+'</span><span class="arrow">&rarr;</span>'+
      (t.onMix.length?'<span class="tag" style="background:'+colorOf(t.onMix[0].code)+'">'+t.onMix[0].code+'</span><span class="mono">'+t.onMix[0].pct+'%</span>':'')+
      '<span class="meta">'+t.onN+' with the tip'+(t.offMix.length?' &middot; without it, mostly '+t.offMix[0].code+' ('+t.offMix[0].pct+'%)':'')+'</span></div>';}).join("")+
    '</div><p class="note">A real tip usually runs 90%+. Anything in the 60s is probably noise — don\'t let a hitter sit on it.</p></div>';}}

 h+='<div class="panel sec"><h3 class="ptitle">Overall mix <span class="aside">'+P.length+' pitches</span></h3>'+mixBar(mix(P))+'</div>';

 h+='<div class="panel sec"><h3 class="ptitle">By count</h3><div class="countgrid">'+COUNTS.map(function(c){
  var a=c.split("-");
  var set=P.filter(function(p){return p.balls===+a[0]&&p.strikes===+a[1];});
  var m=mix(set).slice(0,3);
  return '<div class="cbox'+(set.length<3?" dim":"")+'"><div class="cl">'+c+'<span class="cn">n='+set.length+'</span></div>'+
   (m.length?m.map(function(d){return '<div class="row"><span><i style="background:'+colorOf(d.code)+'"></i>'+d.code+'</span><span>'+d.pct+'%</span></div>';}).join("")
    :'<div class="empty-inline">&mdash;</div>')+'</div>';}).join("")+'</div></div>';

 var sq=buildSequences(P);
 h+='<div class="panel sec"><h3 class="ptitle">What follows what</h3>';
 if(!sq.length)h+='<div class="empty-inline">Needs at least 4 examples of a given setup pitch. Keep charting.</div>';
 else h+='<div style="display:flex;flex-direction:column;gap:7px">'+sq.slice(0,7).map(function(s){
  return '<div class="seqrow"><span class="tag" style="background:'+colorOf(s.prevType)+'">'+s.prevType+'</span>'+
   '<span style="font-size:12px;color:var(--sage)">for a '+s.prevRes+'</span><span class="arrow">&rarr;</span>'+
   '<span class="tag" style="background:'+colorOf(s.top.code)+'">'+s.top.code+'</span><span class="mono">'+s.top.pct+'%</span>'+
   '<span class="meta">'+s.top.n+' of '+s.total+'</span></div>';}).join("")+'</div>';
 h+='</div>';

 h+='<div class="panel"><h3 class="ptitle">Location by pitch type</h3><div class="loczone">'+
  PITCH_TYPES.filter(function(t){return P.some(function(p){return p.type===t.code;});}).map(function(t){
   var set=P.filter(function(p){return p.type===t.code;});
   return '<div class="loccard"><div class="lt" style="color:'+t.color+'">'+t.code+'</div>'+miniZone(set)+
    '<div style="font-size:10.5px;color:var(--sage)">'+set.length+' pitches</div></div>';}).join("")+'</div></div>';

function viewHitters(){
 var P=pool();
 var h='<div class="filters">'+
  '<button class="chip'+(S.f.scope==="game"?" on":"")+'" data-a="fscope" data-v="game">This game</button>'+
  '<button class="chip'+(S.f.scope==="all"?" on":"")+'" data-a="fscope" data-v="all">All games, this pitcher</button></div>'+
  pitcherFilterRow();
 if(P.length<8)return h+'<div class="empty">Not enough charted yet.<br>Hitter splits need a couple of innings before they mean anything.</div>';

 var T=split(P);
 h+='<div class="panel sec"><h3 class="ptitle">Team, against '+(S.f.pitcher==="all"?"this staff":esc(S.f.pitcher))+' <span class="aside">'+P.length+' pitches seen</span></h3><div class="statrow">'+
  stat("Swing rate",T.swingPct+"%",T.swings+" swings")+
  stat("Whiff / swing",T.whiffPct+"%","",T.whiffPct>=30)+
  stat("Chase rate",T.chasePct+"%",T.ozSeen+" out of zone",T.chasePct>=35)+
  stat("Took a strike",T.takeStrikePct+"%",T.izSeen+" in zone",T.takeStrikePct>=35)+
  stat("Hard contact",T.hardPct+"%",T.bip+" in play")+'</div></div>';

 h+='<div class="panel sec"><h3 class="ptitle">How we\'re handling each pitch</h3><div class="loczone">'+
  PITCH_TYPES.filter(function(t){return P.some(function(p){return p.type===t.code;});}).map(function(t){
   var s=split(P.filter(function(p){return p.type===t.code;}));
   return '<div class="vscard"><div class="vt" style="color:'+t.color+'">'+t.label+'</div>'+
    '<div class="vsrow"><span>Seen</span><b>'+s.seen+'</b></div>'+
    '<div class="vsrow"><span>Whiff / swing</span><b>'+s.whiffPct+'%</b></div>'+
    '<div class="vsrow"><span>Chase</span><b>'+s.chasePct+'%</b></div>'+
    '<div class="vsrow"><span>Hard contact</span><b>'+(s.bip?s.hardPct+"%":"&mdash;")+'</b></div>'+
    '<div class="vsrow"><span>Hits</span><b>'+s.hits+'</b></div></div>';}).join("")+'</div></div>';

 var names=[];P.forEach(function(p){if(p.batter&&names.indexOf(p.batter)<0)names.push(p.batter);});
 h+='<div class="panel"><h3 class="ptitle">By hitter</h3>';
 if(!names.length)h+='<div class="empty-inline">No lineup entered for this game — add one on the Games tab and hitter splits will fill in from there.</div>';
 else{
  var rows=names.map(function(n){var ps=P.filter(function(p){return p.batter===n;});
   var s=split(ps);s.name=n;s.pitches=ps;return s;}).sort(function(a,b){return b.seen-a.seen;});
  /* a percentage with two or three events behind it is noise dressed as a number —
     show the raw counts instead until there's enough to divide by */
  var thinAny=false;
  h+='<div class="tblwrap"><table class="htable"><thead><tr><th>Hitter</th><th>Pitches</th><th>Swing</th><th>Whiff</th><th>Chase</th><th>Hard</th><th>Hits</th><th>Trouble pitch</th></tr></thead><tbody>'+
   rows.map(function(r){
    var worst=PITCH_TYPES.map(function(t){return{t:t,s:split(r.pitches.filter(function(p){return p.type===t.code;}))};})
     .filter(function(x){return x.s.swings>=4;}).sort(function(a,b){return b.s.whiffPct-a.s.whiffPct;})[0];
    var dim=' style="color:var(--sage);opacity:.55"';
    if(r.seen<10||r.swings<4)thinAny=true;
    return '<tr><td class="nm">'+esc(r.name)+(r.seen<10?' <span style="color:var(--sage);font-weight:400;font-size:10.5px">thin</span>':'')+'</td>'+
     '<td>'+r.seen+'</td>'+
     '<td'+(r.seen>=10?'':dim)+'>'+(r.seen>=10?r.swingPct+"%":r.swings+"/"+r.seen)+'</td>'+
     '<td'+(r.swings>=4?(r.whiffPct>=35?' style="color:#FF8A3D"':''):dim)+'>'+(r.swings>=4?r.whiffPct+"%":"&mdash;")+'</td>'+
     '<td'+(r.ozSeen>=4?(r.chasePct>=40?' style="color:#FF8A3D"':''):dim)+'>'+(r.ozSeen>=4?r.chasePct+"%":"&mdash;")+'</td>'+
     '<td'+(r.bip>=3?'':dim)+'>'+(r.bip>=3?r.hardPct+"%":"&mdash;")+'</td><td>'+r.hits+'</td>'+
     '<td class="txt">'+(worst&&worst.s.whiffPct>=40?'<span style="color:'+worst.t.color+'">'+worst.t.label+' &middot; '+worst.s.whiffPct+'% whiff</span>':'<span style="color:var(--sage)">&mdash;</span>')+'</td></tr>';}).join("")+
   '</tbody></table></div>';
  if(thinAny)h+='<p class="note danger" style="color:#FF8A3D">Rows marked thin haven\'t seen enough pitches for the rates to mean anything. Switch to "All games, this pitcher" or wait for the season to fill in.</p>';}
 h+='<p class="note">Whiff is per swing, chase is swings at pitches outside the zone. A dash means the sample is too small to divide — it fills in as the count grows. A pinch hitter shows as his own row; the guy he replaced keeps his earlier at-bats. "Trouble pitch" needs four swings at that pitch and 40%+ misses, so treat it as a place to look, not a verdict.</p></div>';
 return h;}

/* ================= events ================= */
function setPath(path,val){
 var parts=path.split(".");
 if(parts.length===1)S[parts[0]]=val;else S[parts[0]][parts[1]]=val;}

document.addEventListener("click",function(e){
 var el=e.target.closest("[data-a]");if(!el)return;
 var a=el.getAttribute("data-a"),v=el.getAttribute("data-v");
 if(a==="tab")S.tab=v;
 else if(a==="type")S.sel.type=v;
 else if(a==="zone")S.sel.zone=+v;
 else if(a==="res"){if(!(S.sel.type&&S.sel.zone!=null))return;
  if(v==="IP")S.pendingIP={outcome:null};else commit(v,null,null);}
 else if(a==="ipout")S.pendingIP.outcome=v;
 else if(a==="ipcommit"){if(!S.pendingIP.outcome)return;commit("IP",S.pendingIP.outcome,v);}
 else if(a==="ipcancel")S.pendingIP=null;
 else if(a==="tell"){var i=S.activeTells.indexOf(v);if(i>=0)S.activeTells.splice(i,1);else S.activeTells.push(v);}
 else if(a==="undo")undo();
 else if(a==="nextab"){S.live=nextAbState(clone(S.live));S.sel={type:null,zone:null};S.pendingIP=null;}
 else if(a==="export")exportCsv();
 else if(a==="backup")exportBackup();
 else if(a==="inn")S.live.inning=Math.max(1,S.live.inning+(+v));
 else if(a==="outs")S.live.outs=Math.min(2,Math.max(0,S.live.outs+(+v)));
 else if(a==="hand")S.live.hand=v;
 else if(a==="run")S.live[v]=!S.live[v];
 else if(a==="resetcount"){S.live.balls=0;S.live.strikes=0;}
 else if(a==="bat")setBatter(S.live.bIdx+(+v));
 else if(a==="subopen"){S.subOpen=!S.subOpen;S.sub={name:"",hand:batter()?batter().hand:"R"};}
 else if(a==="subclose")S.subOpen=false;
 else if(a==="subhand")S.sub.hand=v;
 else if(a==="subhit")subHitter();
 else if(a==="subat")subHitterAt(+v);
 else if(a==="mvbat"){var pr=v.split(":");moveBat(+pr[0],+pr[1]);}
 else if(a==="armopen"){S.armOpen=!S.armOpen;S.newP={name:"",hand:"R"};}
 else if(a==="armclose")S.armOpen=false;
 else if(a==="newphand")S.newP.hand=v;
 else if(a==="addarm")addArm();
 else if(a==="pickarm")pickArm(+v);
 else if(a==="rmarm")removeArm(v);
 else if(a==="newgame")createGame();
 else if(a==="formhand")S.form.hand=v;
 else if(a==="bathand")S.newBat.hand=v;
 else if(a==="addbat"){if(!S.newBat.name.trim())return;
  game().meta.roster.push({name:S.newBat.name.trim(),hand:S.newBat.hand});S.newBat.name="";save();}
 else if(a==="rmbat"){game().meta.roster.splice(+v,1);
  var rl=roster().length;if(rl&&S.live.bIdx>=rl)S.live.bIdx=0;save();}
 else if(a==="toggletips"){game().meta.tipsOn=!game().meta.tipsOn;save();}
 else if(a==="addtell"){if(!S.newTell.trim())return;
  game().meta.tells.push({id:"t"+Date.now(),label:S.newTell.trim()});S.newTell="";save();}
 else if(a==="rmtell"){var g2=game();g2.meta.tells=g2.meta.tells.filter(function(t){return t.id!==v;});save();}
 else if(a==="loadgame"){switchGame(v);S.tab="chart";}
 else if(a==="delgame")deleteGame(v);
 else if(a==="clearpitches")clearPitches();
 else if(a==="fscope"){S.f.scope=v;
  if(v==="all"&&S.f.pitcher==="all"){var cur=arm();if(cur)S.f.pitcher=cur.name;}}
 else if(a==="fpitch")S.f.pitcher=v;
 else if(a==="fhand")S.f.hand=v;
 else if(a==="frun")S.f.run=v;
 else return;
 render();});

document.addEventListener("input",function(e){
 var el=e.target;
 if(el.hasAttribute&&el.hasAttribute("data-in"))setPath(el.getAttribute("data-in"),el.value);});

document.addEventListener("change",function(e){
 var el=e.target;
 if(el.getAttribute&&el.getAttribute("data-sel")==="game"){switchGame(el.value);render();}
 if(el.getAttribute&&el.getAttribute("data-file")==="restore"&&el.files&&el.files[0]){importBackup(el.files[0]);el.value="";}});

document.addEventListener("keydown",function(e){
 if(e.key!=="Enter")return;
 var el=e.target;if(!el.hasAttribute||!el.hasAttribute("data-enter"))return;
 var a=el.getAttribute("data-enter");
 if(a==="addbat"&&S.newBat.name.trim()){game().meta.roster.push({name:S.newBat.name.trim(),hand:S.newBat.hand});S.newBat.name="";save();render();}
 if(a==="addtell"&&S.newTell.trim()){game().meta.tells.push({id:"t"+Date.now(),label:S.newTell.trim()});S.newTell="";save();render();}
 if(a==="subhit")subHitter(),render();
 if(a==="addarm")addArm(),render();});

load();render();

/* offline support — harmless if sw.js isn't uploaded */
if("serviceWorker" in navigator&&location.protocol==="https:")
 window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){});});
</script>
