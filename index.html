<style>
/* Two themes. Dark is the default — night games, dugout, indoors.
   Light exists because a dark screen in direct afternoon sun is unreadable.
   Every colour the app draws is declared here twice; nothing is hardcoded
   below this block, so switching themes is a single attribute flip. */
:root{
 color-scheme:dark;
 --bg:#070F0C;--panel:#101E19;--raise:#1D362C;--line:#2E4E3B;
 --chalk:#EAF0E9;--sage:#87998D;--dirt:#E8A05F;
 /* pitch types */
 --pt-FB:#FF5A47;--pt-SI:#FF8A3D;--pt-CT:#FFC53D;--pt-SL:#4EA8FF;
 --pt-CB:#B98CFF;--pt-CH:#3FCF8E;--pt-SP:#5CE1D8;
 /* semantic */
 --ok:#3FCF8E;--caution:#FFC53D;--warn:#FF8A3D;--bad:#FF5A47;--warnline:#5c2f24;
 /* strike zone + heat */
 --zbg:#0E1B16;--zline:#21382C;--zinbg:#14251D;--zinline:#3A5C48;--zminline:#436B53;
 --pipline:#2C4438;--heat:234,240,233;--oncontrast:#070F0C;
}
:root[data-theme="light"]{
 color-scheme:light;
 --bg:#F4F2ED;--panel:#FFFFFF;--raise:#EDEBE3;--line:#C8CCC2;
 --chalk:#16211B;--sage:#5E6B62;--dirt:#A96A34;
 /* darkened so they hold up against white in sunlight */
 --pt-FB:#D93A28;--pt-SI:#C2620E;--pt-CT:#96700A;--pt-SL:#1E6FD9;
 --pt-CB:#7B4FD9;--pt-CH:#128A55;--pt-SP:#0F7D77;
 --ok:#128A55;--caution:#96700A;--warn:#B4530C;--bad:#D93A28;--warnline:#E0B48C;
 --zbg:#FFFFFF;--zline:#D2D6CC;--zinbg:#E8EDE6;--zinline:#8FA396;--zminline:#8FA396;
 --pipline:#C2C7BD;--heat:22,33,27;--oncontrast:#FFFFFF;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:var(--bg);}
body{color:var(--chalk);font-family:'Archivo',system-ui,-apple-system,sans-serif;min-height:100vh;padding:14px;-webkit-font-smoothing:antialiased;padding-bottom:env(safe-area-inset-bottom,14px);}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--dirt);outline-offset:2px;}

.topbar{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:13px;}
.brand{font-family:'Barlow Condensed';font-weight:700;font-size:27px;letter-spacing:.06em;text-transform:uppercase;line-height:1;}
.brand small{display:block;font-family:'Archivo';font-size:10.5px;font-weight:500;letter-spacing:.17em;color:var(--sage);margin-top:4px;}
.tabs{display:flex;gap:5px;flex-wrap:wrap;}
.tab{padding:9px 15px;border-radius:4px;font-size:11.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--sage);background:var(--panel);}
.tab.on{background:var(--chalk);color:var(--bg);}
.tab.themed{font-size:15px;line-height:1;padding:7px 12px;}
.tab.themed:hover{color:var(--chalk);}

.gamebar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:13px;}
.gamesel{background:var(--panel);border:1px solid var(--line);color:var(--chalk);padding:9px 11px;border-radius:4px;font-size:13px;font-family:inherit;max-width:100%;}
.mini{padding:9px 13px;border-radius:4px;background:var(--panel);border:1px solid var(--line);font-size:11.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--sage);}
.mini:hover{color:var(--chalk);border-color:var(--sage);}

.grid{display:grid;grid-template-columns:300px 1fr;gap:13px;align-items:start;}
@media(max-width:820px){.grid{grid-template-columns:1fr;}}
.col{display:flex;flex-direction:column;gap:13px;}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px;}
.ptitle{font-family:'Barlow Condensed';font-weight:600;font-size:14px;letter-spacing:.16em;text-transform:uppercase;color:var(--sage);margin:0 0 11px;display:flex;justify-content:space-between;align-items:center;gap:8px;}
.ptitle .aside{font-family:'Archivo';font-size:10px;letter-spacing:.08em;text-transform:none;opacity:.75;}

.bar{display:flex;align-items:center;gap:8px;background:var(--raise);border-radius:5px;padding:8px 9px;margin-bottom:9px;}
.bar .who{flex:1;min-width:0;}
.bar .slot{font-family:'IBM Plex Mono';font-size:11px;color:var(--sage);}
.bar .nm{font-family:'Barlow Condensed';font-weight:700;font-size:19px;letter-spacing:.03em;text-transform:uppercase;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.bar .nav{padding:7px 11px;border-radius:4px;background:var(--panel);color:var(--sage);font-size:14px;line-height:1;}
.bar .nav:hover{color:var(--chalk);}
.bar.arm{border-left:3px solid var(--dirt);}
.pcount{font-family:'IBM Plex Mono';font-size:15px;font-weight:600;color:var(--chalk);padding:0 4px 0 2px;line-height:1;white-space:nowrap;}
.pcount em{font-style:normal;font-size:9.5px;letter-spacing:.1em;color:var(--sage);margin-left:2px;}
.pcount.hot{color:var(--warn);}
.pcount.hot em{color:var(--warn);opacity:.7;}
.fatigue{display:flex;align-items:center;gap:11px;background:var(--raise);border-left:3px solid var(--warn);border-radius:0 5px 5px 0;padding:10px 12px;margin-bottom:9px;}
.fatigue .fnum{font-family:'IBM Plex Mono';font-weight:600;font-size:19px;color:var(--warn);}
.fatigue .ftxt{font-size:12px;line-height:1.45;}
.fatigue .ftxt em{font-style:normal;color:var(--sage);font-size:10.5px;display:block;margin-top:3px;letter-spacing:.03em;}
.bar .tiny{padding:6px 9px;border-radius:4px;background:var(--panel);color:var(--sage);font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;}
.bar .tiny:hover{color:var(--chalk);}

.subpanel{background:var(--raise);border:1px solid var(--dirt);border-radius:5px;padding:11px;margin-bottom:9px;}
.subpanel .sl{font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--sage);margin-bottom:7px;}
.subpanel input{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:9px;color:var(--chalk);font-family:inherit;font-size:13.5px;width:100%;margin-bottom:7px;}
.subpanel input:focus{outline:none;border-color:var(--dirt);}
.rowbtns{display:flex;gap:6px;flex-wrap:wrap;}

.board{display:flex;gap:14px;align-items:center;margin-bottom:11px;}
.bigcount{font-family:'IBM Plex Mono';font-weight:600;font-size:44px;line-height:.9;letter-spacing:-.02em;}
.pipcol{display:flex;flex-direction:column;gap:5px;}
.piprow{display:flex;align-items:center;gap:7px;}
.piprow .lab{font-family:'Barlow Condensed';font-size:12px;letter-spacing:.14em;color:var(--sage);width:13px;}
.pips{display:flex;gap:4px;}
.pip{width:11px;height:11px;border-radius:50%;border:1.5px solid var(--pipline);display:block;}

.staterow{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:9px;}
.chip{padding:7px 11px;border-radius:4px;background:var(--raise);border:1px solid var(--line);font-size:12px;font-weight:600;color:var(--sage);}
.chip.on{background:var(--chalk);color:var(--bg);border-color:var(--chalk);}
.chip.sm{font-size:11px;padding:6px 9px;}
.chip.warn{border-color:var(--warnline);color:var(--warn);}
.chip.warn:hover{border-color:var(--bad);}
.stepper{display:flex;align-items:center;background:var(--raise);border:1px solid var(--line);border-radius:4px;overflow:hidden;}
.stepper b{font-family:'IBM Plex Mono';font-size:12.5px;padding:0 8px;min-width:52px;text-align:center;font-weight:600;}
.stepper button{padding:7px 10px;font-size:14px;color:var(--sage);line-height:1;}
.stepper button:hover{color:var(--chalk);background:var(--line);}

.zonewrap{display:flex;flex-direction:column;align-items:center;gap:6px;}
.zonelabels{display:flex;justify-content:space-between;width:100%;font-family:'Barlow Condensed';font-size:11px;letter-spacing:.13em;color:var(--sage);}
.zone{display:grid;grid-template-columns:repeat(5,1fr);gap:3px;width:100%;max-width:250px;aspect-ratio:1;}
.zcell{border:1px solid var(--zline);border-radius:3px;background:var(--zbg);}
.zcell.inzone{border-color:var(--zinline);background:var(--zinbg);}
.zcell.pick{background:var(--chalk);border-color:var(--chalk);}
.umpgrid{max-width:260px;}
.umpgrid .zcell{cursor:default;}
/* the rulebook box, so you can see what he's adding to it or taking away */
.umpgrid .zcell.inzone{box-shadow:inset 0 0 0 1.5px var(--chalk);}
.uzn{font-family:'IBM Plex Mono';font-size:10.5px;font-weight:600;color:var(--chalk);}
.uzn.dim{opacity:.3;font-weight:500;}

.typegrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(86px,1fr));gap:7px;}
.tbtn{padding:13px 8px;border-radius:5px;background:var(--raise);border:1.5px solid var(--line);text-align:center;}
.tbtn:active{transform:scale(.97);}

<script>
/* Runs before first paint so the page never flashes the wrong theme.
   Saved choice wins; otherwise follow whatever the device is set to. */
(function(){
 var t=null;
 try{t=localStorage.getItem("pitchchart:theme");}catch(e){}
 if(t!=="light"&&t!=="dark")
  t=(window.matchMedia&&window.matchMedia("(prefers-color-scheme: light)").matches)?"light":"dark";
 document.documentElement.setAttribute("data-theme",t);
 var m=document.querySelector('meta[name="theme-color"]');
 if(m)m.setAttribute("content",t==="light"?"#F4F2ED":"#070F0C");
})();
</script>
</head>
<body>
<div id="app"></div>
<script>
/* ================= config ================= */
var PITCH_TYPES=[
 {code:"FB",label:"Fastball",color:"var(--pt-FB)"},
 {code:"SI",label:"Sinker",color:"var(--pt-SI)"},
 {code:"CT",label:"Cutter",color:"var(--pt-CT)"},
 {code:"SL",label:"Slider",color:"var(--pt-SL)"},
 {code:"CB",label:"Curve",color:"var(--pt-CB)"},
 {code:"CH",label:"Change",color:"var(--pt-CH)"},
 {code:"SP",label:"Split",color:"var(--pt-SP)"}];
var TYPE_MAP={};PITCH_TYPES.forEach(function(t){TYPE_MAP[t.code]=t;});
function colorOf(c){return TYPE_MAP[c]?TYPE_MAP[c].color:"var(--sage)";}

var RESULTS=[{code:"B",label:"Ball"},{code:"CS",label:"Called strike"},{code:"SS",label:"Swing &amp; miss"},
 {code:"F",label:"Foul"},{code:"IP",label:"In play"},{code:"HBP",label:"HBP"}];
var RES_LABEL={};RESULTS.forEach(function(r){RES_LABEL[r.code]=r.label;});
var OUTCOMES=[{code:"OUT",label:"Out"},{code:"1B",label:"Single"},{code:"2B",label:"Double"},
 {code:"3B",label:"Triple"},{code:"HR",label:"Home run"},{code:"ROE",label:"Error / FC"}];
var CONTACT=[{code:"hard",label:"Hard",color:"var(--ok)"},{code:"med",label:"Medium",color:"var(--caution)"},{code:"weak",label:"Weak",color:"var(--bad)"}];
/* Store the actual field, not "pull" — pull flips with the hitter's hand, and
   a stored relative value goes wrong the moment a lefty pinch-hits. Derive it. */
var FIELDS=[{code:"LF",label:"Left"},{code:"CF",label:"Center"},{code:"RF",label:"Right"}];
var TRAJ=[{code:"GB",label:"Ground"},{code:"LD",label:"Line"},{code:"FB",label:"Fly"}];
function pullSide(hand){return hand==="L"?"RF":"LF";}
function oppoSide(hand){return hand==="L"?"LF":"RF";}
function sprayWord(p){
 if(!p.dir)return null;
 if(p.dir==="CF")return "center";
 return p.dir===pullSide(p.hand)?"pull":"oppo";}
var IN_ZONE=[6,7,8,11,12,13,16,17,18];
function inZone(z){return IN_ZONE.indexOf(z)>=0;}
var COUNTS=["0-0","0-1","0-2","1-0","1-1","1-2","2-0","2-1","2-2","3-0","3-1","3-2"];
var STORE="pitchchart:v1";

function isSwing(r){return r==="SS"||r==="F"||r==="IP";}
function isStrikeRes(r){return r==="CS"||r==="SS"||r==="F";}
function pc(a,b){return b?Math.round(a/b*100):0;}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(m){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m];});}
function clone(o){return JSON.parse(JSON.stringify(o));}

/* ================= state ================= */
var S={
 games:[], activeId:null, tab:"chart", toast:"",
 live:{inning:1,outs:0,balls:0,strikes:0,seq:1,hand:"R",r1:false,r2:false,r3:false,abId:1,bIdx:0,pIdx:0},
 sel:{type:null,zone:null}, pendingIP:null, activeTells:[], history:[], velo:"",
 f:{scope:"game",hand:"all",run:"all",pitcher:"all"},
 form:{opponent:"",pitcher:"",hand:"R",catcher:"",date:new Date().toISOString().slice(0,10)},
 newBat:{name:"",hand:"R"}, newTell:"",
 subOpen:false, sub:{name:"",hand:"R"},
 armOpen:false, newP:{name:"",hand:"R"}
};

function save(){try{localStorage.setItem(STORE,JSON.stringify({games:S.games,activeId:S.activeId}));}
 catch(e){flash("Couldn't save — storage may be full or blocked");}}

/* A pitcher is the same arm across the season even if you typed his name a
   little differently each time. Match on a normalised key rather than the
   literal string, but keep it conservative — "J. Smith" and "John Smith" stay
   separate, because merging two different people is worse than missing a merge. */
function pkeyOf(n){return String(n==null?"":n).toLowerCase()
 .replace(/[^a-z0-9 ]/g," ").replace(/\s+/g," ").trim();}

function migrate(g){
 if(!g.meta.pitchers||!g.meta.pitchers.length)
  g.meta.pitchers=[{id:"pp1",name:g.meta.pitcher,hand:g.meta.hand}];
 g.meta.pitchers.forEach(function(a){if(!a.key)a.key=pkeyOf(a.name);});
 g.pitches.forEach(function(p){
  if(!p.pitcher){p.pitcher=g.meta.pitcher;p.phand=g.meta.hand;}
  if(!p.pkey)p.pkey=pkeyOf(p.pitcher);
  if(p.dir===undefined)p.dir=null;
  if(p.traj===undefined)p.traj=null;});
 return g;}

/* The filter stores a key; this turns it back into something readable. */
function armName(key){
 if(!key||key==="all")return "";
 var hit=null;
 allArms().forEach(function(a){if(a.key===key)hit=a;});
 return hit?hit.name:key;}

/* Every arm seen this season, folded together by key. */
function allArms(){
 var by={};
 S.games.forEach(function(g){
  (g.meta.pitchers||[]).forEach(function(a){
   var k=a.key||pkeyOf(a.name);
   var thrown=g.pitches.filter(function(p){return p.pkey===k;}).length;
   if(!by[k])by[k]={key:k,name:a.name,hand:a.hand,games:0,pitches:0};
   by[k].games++;by[k].pitches+=thrown;
   if(g.meta.date>=(by[k].lastDate||""))
    {by[k].name=a.name;by[k].hand=a.hand;by[k].lastDate=g.meta.date;}});});
 return Object.keys(by).map(function(k){return by[k];})
  .sort(function(a,b){return b.pitches-a.pitches;});}

function load(){try{var raw=localStorage.getItem(STORE);if(!raw)return;var d=JSON.parse(raw);
 S.games=(d.games||[]).map(migrate);
 S.activeId=d.activeId||(S.games[0]&&S.games[0].meta.id)||null;
 var g=game();if(g)restoreLive(g);}catch(e){}}

function game(){for(var i=0;i<S.games.length;i++)if(S.games[i].meta.id===S.activeId)return S.games[i];return null;}
function pitches(){var g=game();return g?g.pitches:[];}
function roster(){var g=game();return g&&g.meta.roster?g.meta.roster:[];}
function arms(){var g=game();return g&&g.meta.pitchers?g.meta.pitchers:[];}
function tells(){var g=game();return g&&g.meta.tells?g.meta.tells:[];}
function tipsOn(){var g=game();return !!(g&&g.meta.tipsOn);}
function batter(){var r=roster();return r.length?r[S.live.bIdx%r.length]:null;}
function arm(){var a=arms();return a.length?a[Math.min(S.live.pIdx,a.length-1)]:null;}

/* ================= theme ================= */
/* Follows the system by default. Once you pick one it sticks, per device —
   a coach who set light for a day game shouldn't get flipped back at dusk. */
var THEME_KEY="pitchchart:theme";
function theme(){return document.documentElement.getAttribute("data-theme")||"dark";}
function applyTheme(t){
 document.documentElement.setAttribute("data-theme",t);
 var m=document.querySelector('meta[name="theme-color"]');
 if(m)m.setAttribute("content",t==="light"?"#F4F2ED":"#070F0C");}
function toggleTheme(){
 var t=theme()==="light"?"dark":"light";
 applyTheme(t);
 try{localStorage.setItem(THEME_KEY,t);}catch(e){}
 render();}
/* Until you pick a side, track the device — so it flips itself at sunset. */
if(window.matchMedia){
 var mq=window.matchMedia("(prefers-color-scheme: light)");
 var onSys=function(e){
  var saved=null;try{saved=localStorage.getItem(THEME_KEY);}catch(x){}
  if(saved==="light"||saved==="dark")return;
  applyTheme(e.matches?"light":"dark");render();};
 if(mq.addEventListener)mq.addEventListener("change",onSys);
 else if(mq.addListener)mq.addListener(onSys);}

var toastTimer=null;
function flash(m){S.toast=m;render();clearTimeout(toastTimer);toastTimer=setTimeout(function(){S.toast="";render();},2200);}

/* ================= analysis ================= */
function mix(ps){var c={};ps.forEach(function(p){c[p.type]=(c[p.type]||0)+1;});var tot=ps.length||1;
 return Object.keys(c).map(function(k){return{code:k,n:c[k],pct:Math.round(c[k]/tot*100)};}).sort(function(a,b){return b.n-a.n;});}

/* A tendency is only news if it differs from what he does the rest of the time.
   Everything below is scored as lift over this pitcher's own baseline mix. */
var MIN_N=4, MIN_PCT=45, MIN_LIFT=18;

function buildKeys(ps){
 var base={};mix(ps).forEach(function(m){base[m.code]=m.pct;});
 var buckets=[
  {label:"First pitch of the at-bat",t:function(p){return p.balls===0&&p.strikes===0;}},
  {label:"With two strikes",t:function(p){return p.strikes===2;}},
  {label:"Ahead in the count",t:function(p){return p.strikes>p.balls;}},
  {label:"Behind in the count",t:function(p){return p.balls>p.strikes;}},
  {label:"Runners on base",t:function(p){return p.r1||p.r2||p.r3;}},
  {label:"Bases empty",t:function(p){return !p.r1&&!p.r2&&!p.r3;}},
  {label:"vs. left-handed hitters",t:function(p){return p.hand==="L";}},
  {label:"vs. right-handed hitters",t:function(p){return p.hand==="R";}}];
 /* 0-0 is the same set as "first pitch" — skip it so the list can't say it twice */
 COUNTS.forEach(function(c){if(c==="0-0")return;var a=c.split("-");
  buckets.push({label:"On "+c,t:function(p){return p.balls===+a[0]&&p.strikes===+a[1];}});});

 var keys=[];
 buckets.forEach(function(bk){
  var set=ps.filter(bk.t);if(set.length<MIN_N)return;
  var m=mix(set);if(!m.length)return;
  var best=null;
  m.slice(0,2).forEach(function(d){
   var lift=d.pct-(base[d.code]||0);
   if(d.pct>=MIN_PCT&&lift>=MIN_LIFT&&(!best||lift>best.lift))
    best={code:d.code,pct:d.pct,n:d.n,lift:lift};});
  if(!best)return;
  keys.push({label:bk.label,type:best.code,pct:best.pct,base:base[best.code]||0,lift:best.lift,
   n:best.n,total:set.length,thin:set.length<6,score:best.lift*Math.min(set.length,24)});});

 /* location: same idea — compare a pitch type's location to where everything else goes */
 var zoned=ps.filter(function(p){return p.zone!=null;});
 if(zoned.length>=12){
  var dims=[
   {key:"low",txt:"finishes low or below the zone",t:function(p){return Math.floor(p.zone/5)>=3;}},
   {key:"up",txt:"lives up in the zone",t:function(p){return Math.floor(p.zone/5)<=1;}},
   {key:"chase",txt:"is out of the zone",t:function(p){return !inZone(p.zone);}}];
  PITCH_TYPES.forEach(function(t){
   var set=zoned.filter(function(p){return p.type===t.code;});if(set.length<5)return;
   var rest=zoned.filter(function(p){return p.type!==t.code;});if(rest.length<5)return;
   dims.forEach(function(d){
    var v=pc(set.filter(d.t).length,set.length),b=pc(rest.filter(d.t).length,rest.length);
    if(v>=50&&v-b>=MIN_LIFT)
     keys.push({loc:true,text:v+"% of his "+t.label.toLowerCase()+"s "+d.txt,
      type:t.code,pct:v,base:b,lift:v-b,n:set.filter(d.t).length,total:set.length,
      thin:set.length<8,score:(v-b)*Math.min(set.length,24)});});});}

 return keys.sort(function(a,b){return b.score-a.score;}).slice(0,6);}

function buildSequences(ps){
 var byAb={};ps.forEach(function(p){(byAb[p.abId]=byAb[p.abId]||[]).push(p);});
 var map={};
 Object.keys(byAb).forEach(function(k){var ab=byAb[k].slice().sort(function(a,b){return a.seq-b.seq;});
  for(var i=1;i<ab.length;i++){var prev=ab[i-1];
   if(prev.pitcher!==ab[i].pitcher)continue;
   if(!isStrikeRes(prev.result)&&prev.result!=="B")continue;

/* ================= velocity =================

   a half-charted game still gives honest numbers for the pitches you did get. */
var V_MIN=3;    /* fewest readings before an average is worth printing */

function withVelo(ps){return ps.filter(function(p){return typeof p.velo==="number"&&isFinite(p.velo);});}
/* Last reading from the man currently on the mound — shown as the input's

function lastVelo(){

function vAvg(ps){if(!ps.length)return null;var s=0;ps.forEach(function(p){s+=p.velo;});return s/ps.length;}
function v1(n){return n==null?"&mdash;":(Math.round(n*10)/10).toFixed(1);}

  var set=withVelo(ps.filter(function(p){return p.type===t.code;}));
  if(!set.length)return null;
  var lo=Infinity,hi=-Infinity;
  set.forEach(function(p){if(p.velo<lo)lo=p.velo;if(p.velo>hi)hi=p.velo;});
  return{code:t.code,label:t.label,n:set.length,avg:vAvg(set),lo:lo,hi:hi,thin:set.length<V_MIN};

/* Per-inning averages for one pitch type — this is the fatigue read. */

  .map(function(i){return{inning:i,n:by[i].length,avg:vAvg(by[i])};});}

/* A dip only counts if it's off his own peak and later in the outing —
   a slow first inning while he's still loose isn't fatigue. */
function veloDip(rows){

/* What he gives up, and for what. Each split is measured against the same
   pitch type everywhere else — not against his whole mix, since a changeup
   being slower than a fastball isn't news. */
function buildVeloTells(ps){

 PITCH_TYPES.forEach(function(t){
  var all=withVelo(ps.filter(function(p){return p.type===t.code;}));
  if(all.length<V_MIN*2)return;
  var dims=[
   {kind:"count",label:"on the first pitch",t:function(p){return p.balls===0&&p.strikes===0;}},
   {kind:"count",label:"with two strikes",t:function(p){return p.strikes===2;}},
   {kind:"count",label:"when ahead",t:function(p){return p.strikes>p.balls;}},
   {kind:"count",label:"when behind",t:function(p){return p.balls>p.strikes;}},
   {kind:"count",label:"on 3&ndash;2",t:function(p){return p.balls===3&&p.strikes===2;}},
   {kind:"spot",label:"when he works down",t:function(p){return p.zone!=null&&Math.floor(p.zone/5)>=3;}},
   {kind:"spot",label:"when he works up",t:function(p){return p.zone!=null&&Math.floor(p.zone/5)<=1;}},
   {kind:"spot",label:"off the plate",t:function(p){return p.zone!=null&&!inZone(p.zone);}},
   {kind:"spot",label:"in the strike zone",t:function(p){return p.zone!=null&&inZone(p.zone);}},
   {kind:"spot",label:"to the 3B side",t:function(p){return p.zone!=null&&(p.zone%5)<=1;}},
   {kind:"spot",label:"to the 1B side",t:function(p){return p.zone!=null&&(p.zone%5)>=3;}},
   {kind:"base",label:"with runners on",t:function(p){return p.r1||p.r2||p.r3;}}];
  dims.forEach(function(d){

/* ================= batted balls =================

  set.forEach(function(p){var v=get(p);if(v!=null&&c[v]!==undefined)c[v]++;});

/* ================= what he throws here =================
   The tendency work already exists on the Pitcher tab, but by the time you've
   navigated there the pitch has been thrown. This answers the same question
   against the live situation, on the charting screen.

   The exact count is the sharpest read and also the thinnest, so fall back

   "on 1-2 vs righties" and "with two strikes" are not the same claim. */
var L_MIN=5;  /* fewest pitches in a bucket before it's worth showing */

function liveReads(L){

  {label:"on "+L.balls+"-"+L.strikes+" vs "+L.hand+"HH",
   t:function(p){return p.balls===L.balls&&p.strikes===L.strikes&&p.hand===L.hand;}},
  {label:"on "+L.balls+"-"+L.strikes,

/* ================= workload =================

/* ================= the umpire =================

/* Turn a grid index into words. Columns run catcher's view: 0 is the

function pool(){

function commit(result,outcome,contact){

  abId:S.live.abId,seq:S.live.seq,inning:S.live.inning,outs:S.live.outs,
  balls:S.live.balls,strikes:S.live.strikes,hand:S.live.hand,
  r1:S.live.r1,r2:S.live.r2,r3:S.live.r3,batter:b?b.name:null,bIdx:S.live.bIdx,
  pitcher:a?a.name:g.meta.pitcher,phand:a?a.hand:g.meta.hand,
  pkey:pkeyOf(a?a.name:g.meta.pitcher),
  type:S.sel.type,zone:S.sel.zone,velo:S.velo?Number(S.velo):null,
  result:result,outcome:outcome||null,contact:contact||null,
  dir:S.pendingIP?S.pendingIP.dir:null,traj:S.pendingIP?S.pendingIP.traj:null,
  tells:tipsOn()?S.activeTells.slice():[]});

 S.history.push(clone(S.live));
 var n=clone(S.live);n.seq=n.seq+1;
 if(result==="B"){n.balls++;if(n.balls>=4){n.r1=true;n=nextAbState(n);}}
 else if(result==="CS"||result==="SS"){n.strikes++;if(n.strikes>=3){n=nextAbState(addOut(n));}}

 var blob=new Blob([[head].concat(rows).join("\n")],{type:"text/csv"});
 var a=document.createElement("a");a.href=URL.createObjectURL(blob);
 a.download=g.meta.pitcher.replace(/\s+/g,"_")+"_"+g.meta.date+".csv";

function exportBackup(){

function importBackup(file){
 var fr=new FileReader();
 fr.onload=function(){try{var d=JSON.parse(fr.result);
  if(!d.games||!d.games.length){flash("No games in that file");return;}
  var have={};S.games.forEach(function(g){have[g.meta.id]=1;});
  var added=0;d.games.forEach(function(g){if(!have[g.meta.id]){S.games.push(migrate(g));added++;}});
  if(!S.activeId&&S.games.length)S.activeId=S.games[0].meta.id;
  save();flash(added+" game"+(added===1?"":"s")+" imported");}
  catch(e){flash("Couldn't read that file");}};
 fr.readAsText(file);}

function veloPanel(P){
 var vs=withVelo(P);
 var h='<div class="panel sec"><h3 class="ptitle">Velocity<span class="aside">'+
  (vs.length?vs.length+' of '+P.length+' pitches gunned':'optional')+'</span></h3>';

 if(!vs.length)
  return h+'<div class="empty-inline">No readings yet. There\'s a <b>velo</b> box on the Chart tab, '+
   'next to Reset count &mdash; type a number before you tap the result and it rides along with that pitch. '+
   'Skip it whenever the gun\'s down; every other number in the app works without it.</div></div>';

 var rows=veloByType(vs);
 h+='<div class="tblwrap"><table class="htable"><tr><th>Pitch</th><th>N</th><th>Avg</th><th>Peak</th><th>Low</th><th>Spread</th></tr>'+
  rows.map(function(r){
   return '<tr><td class="nm" style="color:'+colorOf(r.code)+'">'+r.code+'</td>'+
    '<td'+(r.thin?' style="color:var(--sage)"':'')+'>'+r.n+'</td>'+
    '<td>'+v1(r.avg)+'</td><td>'+v1(r.hi)+'</td><td>'+v1(r.lo)+'</td>'+
    '<td style="color:var(--sage)">'+v1(r.hi-r.lo)+'</td></tr>';}).join("")+'</table></div>';
 if(rows.some(function(r){return r.thin;}))
  h+='<p class="note">Rows under '+V_MIN+' readings are too thin to average — treat them as a single data point.</p>';

 /* fatigue read — the top few types by volume that span more than one inning */
 /* A trend needs at least two innings that stand on their own. Four innings of
    one pitch each will draw a tidy descending staircase out of pure scatter,
    and dimming the bars isn't a strong enough warning against reading it. */
 var trends=rows.filter(function(r){return r.n>=V_MIN;}).slice(0,3).map(function(r){
  return{code:r.code,rows:veloByInning(vs,r.code)};})
  .filter(function(t){
   return t.rows.filter(function(r){return r.n>=V_MIN;}).length>=2;});

 if(trends.length){
  h+='<div style="margin-top:13px"><div class="sl" style="font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--sage);margin-bottom:8px">Inning by inning</div>';
  trends.forEach(function(t){
   var rs=t.rows,lo=Infinity,hi=-Infinity;
   rs.forEach(function(r){if(r.avg<lo)lo=r.avg;if(r.avg>hi)hi=r.avg;});
   /* Anchor the scale to a 4 mph window, not to his own spread. Otherwise a
      guy who holds 90.1–90.4 all day draws the same alarming staircase as one
      who's lost five ticks, and the chart lies about the thing it's for. */
   var span=Math.max(hi-lo,4);
   h+='<div class="vrow"><span class="vcode" style="color:'+colorOf(t.code)+'">'+t.code+'</span><div class="vtrend">'+
    rs.map(function(r){
     var pctH=28+62*((r.avg-lo)/span);
     return '<div class="vbar" title="Inning '+r.inning+' · '+v1(r.avg)+' mph · '+r.n+' pitches">'+
      '<span class="vval'+(r.n<V_MIN?' vthin':'')+'">'+v1(r.avg)+'</span>'+
      '<i style="height:'+pctH.toFixed(0)+'%;background:'+colorOf(t.code)+(r.n<V_MIN?';opacity:.35':'')+'"></i>'+
      '<span class="vinn">'+r.inning+'</span></div>';}).join("")+'</div></div>';
   var dip=veloDip(rs);
   if(dip)
    h+='<p class="note"'+(dip.real?' style="color:var(--warn)"':'')+'>'+t.code+' is <b>'+v1(dip.drop)+
     '</b> off its peak &mdash; '+v1(dip.peak.avg)+' in the '+ord(dip.peak.inning)+', '+v1(dip.last.avg)+
     ' in the '+ord(dip.last.inning)+'.'+(dip.real?' That\'s a real dip, not gun scatter.':' Close enough to noise that I\'d want more readings.')+'</p>';});
  h+='</div>';}

 var tells=buildVeloTells(vs);
 if(tells.length){
  h+='<div style="margin-top:14px"><div class="sl" style="font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--sage);margin-bottom:8px">What he gives up, and for what</div><div class="keylist">'+
   tells.map(function(k){
    var faster=k.delta>0;
    return '<div class="key" style="border-left-color:'+colorOf(k.code)+'">'+
     '<div class="kpct" style="color:'+(faster?'var(--ok)':'var(--warn)')+'">'+vSigned(k.delta)+'</div>'+
     '<div class="ktxt">His <b>'+k.label.toLowerCase()+'</b> '+(faster?'plays up':'drops off')+' '+k.where+
     '<em>'+v1(k.avg)+' there vs '+v1(k.base)+' otherwise &middot; '+k.n+' of '+k.total+
     (k.thin?' &middot; thin sample':'')+'</em></div></div>';}).join("")+'</div>';
  h+='<p class="note">Measured against the same pitch everywhere else, so a slow changeup isn\'t flagged just for being a changeup. Gaps under '+v1(V_NOTE)+' mph are left out.</p></div>';}
 else if(vs.length>=V_MIN*2)
  h+='<p class="note">Nothing yet where he changes speed for a spot or a count. Needs about '+(V_MIN*2)+' readings of one pitch type before splits mean anything.</p>';

 return h+'</div>';}

function ord(n){var s=["th","st","nd","rd"],v=n%100;return n+(s[(v-20)%10]||s[v]||s[0]);}

 else{

     '<td'+(r.ozSeen>=4?(r.chasePct>=40?' style="color:var(--warn)"':''):dim)+'>'+(r.ozSeen>=4?r.chasePct+"%":"&mdash;")+'</td>'+

     '<td class="txt">'+(worst&&worst.s.whiffPct>=40?'<span style="color:'+worst.t.color+'">'+worst.t.label+' &middot; '+worst.s.whiffPct+'% whiff</span>':'<span style="color:var(--sage)">&mdash;</span>')+'</td>'+
     '<td class="txt">'+(function(){

function setPath(path,val){
 var parts=path.split(".");

document.addEventListener("click",function(e){
 var el=e.target.closest("[data-a]");if(!el)return;
 var a=el.getAttribute("data-a"),v=el.getAttribute("data-v");
 if(a==="theme"){toggleTheme();return;}
 else if(a==="tab")S.tab=v;
 else if(a==="type")S.sel.type=v;
 else if(a==="zone")S.sel.zone=+v;
 else if(a==="res"){if(!(S.sel.type&&S.sel.zone!=null))return;
  if(v==="IP")S.pendingIP={outcome:null,dir:null,traj:null};else commit(v,null,null);}
 else if(a==="ipout")S.pendingIP.outcome=v;
 else if(a==="ipdir")S.pendingIP.dir=(S.pendingIP.dir===v?null:v);
 else if(a==="iptraj")S.pendingIP.traj=(S.pendingIP.traj===v?null:v);
 else if(a==="ipcommit"){if(!S.pendingIP.outcome)return;commit("IP",S.pendingIP.outcome,v);}
 else if(a==="ipcancel")S.pendingIP=null;
 else if(a==="tell"){var i=S.activeTells.indexOf(v);if(i>=0)S.activeTells.splice(i,1);else S.activeTells.push(v);}
 else if(a==="undo")undo();
 else if(a==="nextab"){S.live=nextAbState(clone(S.live));S.sel={type:null,zone:null};S.pendingIP=null;}
 else if(a==="export")exportCsv();
 else if(a==="backup")exportBackup();
 else if(a==="inn")S.live.inning=Math.max(1,S.live.inning+(+v));
 else if(a==="outs")S.live.outs=Math.min(2,Math.max(0,S.live.outs+(+v)));
 else if(a==="hand")S.live.hand=v;
 else if(a==="run")S.live[v]=!S.live[v];
 else if(a==="resetcount"){S.live.balls=0;S.live.strikes=0;}
 else if(a==="bat")setBatter(S.live.bIdx+(+v));
 else if(a==="subopen"){S.subOpen=!S.subOpen;S.sub={name:"",hand:batter()?batter().hand:"R"};}
 else if(a==="subclose")S.subOpen=false;
 else if(a==="subhand")S.sub.hand=v;
 else if(a==="subhit")subHitter();
 else if(a==="subat")subHitterAt(+v);
 else if(a==="mvbat"){var pr=v.split(":");moveBat(+pr[0],+pr[1]);}
 else if(a==="armopen"){S.armOpen=!S.armOpen;S.newP={name:"",hand:"R"};}
 else if(a==="armclose")S.armOpen=false;
 else if(a==="newphand")S.newP.hand=v;
 else if(a==="addarm")addArm();
 else if(a==="pickarm")pickArm(+v);
 else if(a==="rmarm")removeArm(v);
 else if(a==="newgame")createGame();
 else if(a==="formhand")S.form.hand=v;
 else if(a==="bathand")S.newBat.hand=v;
 else if(a==="addbat"){if(!S.newBat.name.trim())return;
  game().meta.roster.push({name:S.newBat.name.trim(),hand:S.newBat.hand});S.newBat.name="";save();}
 else if(a==="rmbat"){game().meta.roster.splice(+v,1);
  var rl=roster().length;if(rl&&S.live.bIdx>=rl)S.live.bIdx=0;save();}
 else if(a==="toggletips"){game().meta.tipsOn=!game().meta.tipsOn;save();}
 else if(a==="addtell"){if(!S.newTell.trim())return;
  game().meta.tells.push({id:"t"+Date.now(),label:S.newTell.trim()});S.newTell="";save();}
 else if(a==="rmtell"){var g2=game();g2.meta.tells=g2.meta.tells.filter(function(t){return t.id!==v;});save();}
 else if(a==="loadgame"){switchGame(v);S.tab="chart";}
 else if(a==="delgame")deleteGame(v);
 else if(a==="clearpitches")clearPitches();
 else if(a==="fscope"){S.f.scope=v;
  if(v==="all"&&S.f.pitcher==="all"){var cur=arm();if(cur)S.f.pitcher=cur.key||pkeyOf(cur.name);}}
 else if(a==="fpitch")S.f.pitcher=v;
 else if(a==="fhand")S.f.hand=v;
 else if(a==="frun")S.f.run=v;
 else return;
 render();});

document.addEventListener("input",function(e){
 var el=e.target;
 if(el.hasAttribute&&el.hasAttribute("data-in"))setPath(el.getAttribute("data-in"),el.value);});

document.addEventListener("change",function(e){
 var el=e.target;
 if(el.getAttribute&&el.getAttribute("data-sel")==="game"){switchGame(el.value);render();}
 if(el.getAttribute&&el.getAttribute("data-file")==="restore"&&el.files&&el.files[0]){importBackup(el.files[0]);el.value="";}});

document.addEventListener("keydown",function(e){
 if(e.key!=="Enter")return;
 var el=e.target;if(!el.hasAttribute||!el.hasAttribute("data-enter"))return;
 var a=el.getAttribute("data-enter");
 if(a==="addbat"&&S.newBat.name.trim()){game().meta.roster.push({name:S.newBat.name.trim(),hand:S.newBat.hand});S.newBat.name="";save();render();}
 if(a==="addtell"&&S.newTell.trim()){game().meta.tells.push({id:"t"+Date.now(),label:S.newTell.trim()});S.newTell="";save();render();}
 if(a==="subhit")subHitter(),render();
 if(a==="addarm")addArm(),render();});

load();render();

/* offline support — harmless if sw.js isn't uploaded */
if("serviceWorker" in navigator&&location.protocol==="https:")
 window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){});});
</script>
